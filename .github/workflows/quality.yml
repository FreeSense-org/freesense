name: Quality

on:
  pull_request:
  push:
    branches: [main, "RELENG_*"]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install checks
        run: sudo apt-get update -q && sudo apt-get install -yq shellcheck
      - name: Resolve matching system-ports branch
        id: sysports
        env:
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/FreeSense-org/freesense-system-ports.git "${CANDIDATE_REF}" >/dev/null; then
            echo "ref=${CANDIDATE_REF}" >> "${GITHUB_OUTPUT}"
          else
            echo "ref=main" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: FreeSense-org/freesense-system-ports
          path: system-ports
          ref: ${{ steps.sysports.outputs.ref }}
      - name: FreeSense-system pkg-plist lists every shipped file
        # Files under src/ are packaged only if security/FreeSense-system/pkg-plist in
        # freesense-system-ports names them; a removed file left in the plist fails the
        # package build. Add or remove files with a same-named branch in that repo.
        run: python3 system-ports/tools/system_plist_audit.py --source . --plist system-ports/security/FreeSense-system/pkg-plist
      - name: PHP 8.5 syntax and deprecations
        # Lint with the PHP release the System image ships. Any compile-time
        # deprecation fails the job.
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            php:8.5-cli sh tools/ci/php-lint.sh
      - name: PHP 8.5 smoke tests
        # tests/ConfigLibTest.php is not run here: it loads config.lib.inc ->
        # util.inc, which needs the FreeBSD-patched PEAR Net_IPv6 and other
        # appliance-only runtime pieces that are not available on Linux.
        run: |
          python3 -m json.tool src/etc/freesense-package-catalog.json >/dev/null
          docker run --rm -v "$PWD:/src" -w /src php:8.5-cli sh -ec '
            php -v | head -n 1
            for t in \
              ConfigImportGuardSmokeTest \
              ConfigUpgradeSmokeTest \
              ConfigCacheSmokeTest \
              WebGuiRestoreSmokeTest \
              InstallerRecoverySmokeTest \
              PackageCatalogSmokeTest \
              PackageRegistrationSmokeTest \
              PackageRestoreSmokeTest \
              PackageRuntimeCompatibilitySmokeTest \
              RepositoryTrustSmokeTest \
              NicSettingsSmokeTest \
              ReproducibleArtifactsSmokeTest \
              PoudriereSourceBuildSmokeTest \
              PhpFdSetsizeWorkaroundSmokeTest \
              Arm64CrossCompilerSmokeTest \
              KernelConfigPreflightSmokeTest \
              KernelModulePolicySmokeTest \
              VxlanConfigSmokeTest \
              RemoteBackupSmokeTest \
              RestApiSmokeTest \
              RestApiSessionSmokeTest \
              RestApiBatchSmokeTest \
              StatusMetricsSmokeTest \
              GlobalsRegistrySmokeTest \
              XmlNumericKeySmokeTest; do
              php -d error_reporting=E_ALL "tests/$t.php"
            done
          '
      - name: Release-sensitive shell syntax
        run: |
          sh -n build.sh
          sh -n build/scripts/create_core_pkg.sh
          sh -n tools/builder_common.sh
          sh -n tools/installer/installer-rc.local
          sh -n tools/installer/recover_configxml.sh
          sh -n tools/installer/import_foreign_config.sh
          sh -n tools/ci/freesense-localrepo.sh
          sh -n tools/ci/freesense-ports-overlay.sh
          grep -Fq '.include "${.CURDIR:H:H}/Mk/bsd.freesense-package.mk"' tools/ci/freesense-ports-overlay.sh
          ! grep -R -Eq 'FREESENSE_EPOCH|/root/epoch' tools
          shellcheck -S error tools/ci/freesense-assemble-iso.sh
          shellcheck -S error tools/ci/freesense-dist-world.sh
          shellcheck -S warning tools/ci/php-lint.sh
      - name: Reject committed secrets
        run: |
          if git grep -IEn '(^[[:space:]]*-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----[[:space:]]*$|R2_SECRET_ACCESS_KEY[=:][[:space:]]*[^$<{])' -- . ':!*.md'; then
            echo 'Potential credential material found in tracked files' >&2
            exit 1
          fi
      - name: Reject vendor infrastructure dependencies
        run: |
          if git grep -IEn '(https?://[^[:space:]]*netgate\.com|(?:files|packages(-beta)?|gitlab|codesigner)\.netgate\.com|\.nyi\.netgate\.com)' -- . ':!NOTICE' ':!*.md'; then
            echo 'Active Netgate infrastructure reference found' >&2
            exit 1
          fi
      - name: Reject legacy Font Awesome icon names
        # docs/webui/01-tokens.md: one canonical name per icon. The aliases
        # still render (Font Awesome keeps them for packages), but core pages
        # use the canonical names so the icon vocabulary stays searchable.
        run: |
          aliases='fa-(cog|undo|save|times|plus-circle|times-circle|search|check-circle|angle-double-(left|right)|play-circle|random|question-circle|minus-circle|plus-square|tasks|stop-circle|pause-circle|exclamation-triangle|archive|info-circle|refresh|edit|warning|close|remove|external-link|lightbulb-o)'
          if git grep -IPn "(?<![\w-])${aliases}(?![\w-])|(?<![\w-])fa fa-" -- 'src/usr/local/www' 'src/etc/inc' ':!src/usr/local/www/vendor' ':!*.md'; then
            echo 'Legacy Font Awesome icon name found; use the canonical name (see docs/webui/01-tokens.md)' >&2
            exit 1
          fi
