name: OpenSSF Scorecard

# Supply-chain security checks (pinned actions, token permissions, branch
# protection, security policy, ...). Results appear under Security > Code
# scanning and are published to the OpenSSF API for the README badge
# (https://scorecard.dev/viewer/?uri=github.com/FreeSense-org/freesense).
# Publishing requires this job to contain only the approved actions below.
on:
  branch_protection_rule:
  schedule:
    # Mondays 05:17 UTC.
    - cron: '17 5 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: scorecard
