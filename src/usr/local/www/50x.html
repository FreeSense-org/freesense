<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
		<link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css" type="text/css">
		<link rel="stylesheet" href="/css/login.css" type="text/css">
		<title>50x - Server Error</title>
	</head>

	<body id="login">
		<div class="fs-login">
			<aside class="fs-login__brand">
				<div class="fs-login__brand-inner">
					<div class="fs-login__logo"></div>
					<p class="fs-login__tag">The open-source firewall, <span class="fs-login__tag-accent">rebuilt in the open.</span></p>
				</div>
			</aside>

			<main class="fs-login__panel">
				<div class="fs-login__card">
					<div class="fs-login__logo-sm"></div>
					<h1 class="fs-login__title">Server error</h1>
					<p class="fs-login__host">The web server encountered an error processing this request. Check the <a href="/crash_reporter.php">Crash Reporter</a> for details.</p>
					<a class="btn btn-primary fs-login__submit" href="/">Return to Dashboard</a>
					<footer class="fs-login__footer">
						<a target="_blank" href="https://freesense.org">FreeSense</a>
						is free and open-source software.
						&copy; 2025 - 2026 The FreeSense Project.
						<a target="_blank" href="https://freesense.org/license">View license</a>.
					</footer>
				</div>
			</main>
		</div>

		<script>
			/* Inline the logo so login.css can colour it, as on the sign-in page. */
			fetch('/logo.svg').then((r) => r.ok ? r.text() : '').then((svg) => {
				document.querySelectorAll('.fs-login__logo, .fs-login__logo-sm').forEach((el) => { el.innerHTML = svg; });
			});
		</script>
	</body>
</html>
